plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'jacoco'
}

group = 'telegram.files'
version = providers.fileContents(layout.projectDirectory.file('../VERSION')).asText.map { it.trim() }.get()
def applicationVersion = version.toString()
def gitCommit = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: 'unknown' }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

repositories {
    mavenCentral()
}

ext {
    vertxVersion = '5.0.0'
}

dependencies {
    def osName = System.getProperty("os.name").toLowerCase()

    implementation "io.vertx:vertx-core:$vertxVersion"
    implementation "io.vertx:vertx-web:$vertxVersion"
    implementation "io.vertx:vertx-jdbc-client:$vertxVersion"
    implementation "io.vertx:vertx-sql-client-templates:$vertxVersion"
    implementation "io.vertx:vertx-health-check:$vertxVersion"
    implementation "io.vertx:vertx-pg-client:$vertxVersion"
    implementation "io.vertx:vertx-mysql-client:$vertxVersion"
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation 'com.ongres.scram:scram-client:3.1'
    implementation 'io.agroal:agroal-api:1.16'
    implementation 'io.agroal:agroal-pool:1.16'
    implementation 'cn.hutool:hutool-core:5.8.34'
    implementation 'cn.hutool:hutool-log:5.8.34'
    implementation 'org.jooq:jool:0.9.15'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    implementation 'org.apache.commons:commons-jexl3:3.6.1'
    implementation 'com.openai:openai-java:4.13.0'
    runtimeOnly 'org.slf4j:slf4j-jdk14:2.0.16'
    // only for macos
    if (osName.contains("mac")) {
        implementation('io.netty:netty-resolver-dns-native-macos:4.2.0.Final') {
            artifact {
                name = 'netty-resolver-dns-native-macos'
                type = 'jar'
                classifier = System.getProperty("os.arch").contains("aarch64") ? "osx-aarch_64" : "osx-x86_64"
            }
        }
    }

    testImplementation "io.vertx:vertx-junit5:$vertxVersion"
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = '0.8.16'
}

test {
    def envFile = file('../.env.test')
    if (envFile.exists()) {
        doFirst {
            envFile.eachLine {
                if (!it.startsWith("#") && !it.isEmpty()) {
                    def (key, value) = it.tokenize('=')
                    environment key, value
                }
                return
            }
        }
    }
    jvmArgs "-Djava.library.path=${System.getenv('TDLIB_PATH')}",
            "-XX:+EnableDynamicAgentLoading",
            "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}"
    environment "APP_ROOT", layout.buildDirectory.dir('test-data').get().asFile.absolutePath
    systemProperty 'telegram.files.test.classpath', sourceSets.test.runtimeClasspath.asPath
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = false
    }
    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: "org/drinkless/tdlib/**")
        })
    }
}

tasks.build {
    dependsOn shadowJar
}

tasks.named('processResources') {
    inputs.property('applicationVersion', applicationVersion)
    filesMatching('telegram-files-version.properties') {
        expand(applicationVersion: applicationVersion)
    }
}

tasks.register('syncSeedContracts', Sync) {
    def sourceDir = providers.environmentVariable('TELEGRAM_SEED_CONTRACT_DIR')
            .orElse(layout.projectDirectory.dir('../../telegram-seed/packages/contracts/artifacts/v1').asFile.absolutePath)
    from(sourceDir)
    into(layout.projectDirectory.dir('contracts/telegram-seed-v1'))
    doFirst {
        if (!file(sourceDir.get()).isDirectory()) {
            throw new GradleException("telegram-seed contract artifact not found: ${sourceDir.get()}")
        }
    }
}

shadowJar {
    filesMatching('META-INF/*.kotlin_module') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    archiveBaseName.set('telegram-files')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes(
                'Main-Class': 'telegram.files.Start'
        )
    }
}

tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Built-By': System.getProperty('user.name'),
                'Build-Time': new Date().format('yyyy-MM-dd HH:mm:ss'),
                'Git-Commit': gitCommit.get()
        )
    }
}
